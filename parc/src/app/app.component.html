<mat-toolbar>
  <span><a routerLink="/accueil">{{ 'Parc d\'attraction' | translate }}</a></span>
  <div class="toolbar-actions">
    <button mat-stroked-button (click)="toggleLanguage()" class="lang-button" [attr.aria-label]="'Changer la langue'">
      {{ getLanguageLabel() }}
    </button>
    <button *ngIf="authService.isLoggedIn" mat-stroked-button (click)="logout()">{{ 'Déconnexion' | translate }}</button>
  </div>
</mat-toolbar>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
